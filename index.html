<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>A股/转债实时板块表</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./styles.css" />
    <script
      type="module"
      src="https://widgets.tradingview-widget.com/w/en/tv-mini-chart.js"
    ></script>
  </head>
  <body>
    <main class="app-shell">
      <header class="market-bar" aria-label="行情控制">
        <div class="brand">
          <h1 id="boardTitle">A股/转债实时板块表</h1>
          <p id="marketStatus">正在连接实时行情...</p>
        </div>
        <section class="global-indices" aria-label="市场指数">
          <span class="indices-title">指数</span>
          <div id="globalIndices" class="index-list"></div>
        </section>
        <div class="controls">
          <div class="view-switch" role="group" aria-label="看板视图">
            <button id="mainViewButton" class="view-switch-button is-active" type="button" aria-pressed="true">主看板</button>
            <button id="themeViewButton" class="view-switch-button" type="button" aria-pressed="false">看板二·题材转债</button>
          </div>
          <label class="search-box">
            <span>搜索</span>
            <input id="searchInput" type="search" placeholder="板块 / 股票 / 转债" autocomplete="off" />
          </label>
          <label class="select-box">
            <span>排序</span>
            <select id="sortSelect">
              <option value="hot">默认</option>
              <option value="change">涨幅</option>
              <option value="name">名称</option>
            </select>
          </label>
          <label class="select-box">
            <span>范围</span>
            <select id="rangeSelect">
              <option value="all">全部</option>
              <option value="up">上涨</option>
              <option value="down">下跌</option>
            </select>
          </label>
          <label class="toggle-box" title="显示或隐藏每只股票/转债的分时缩略走势">
            <span>K线</span>
            <input id="sparkToggle" type="checkbox" />
          </label>
          <button id="refreshButton" class="icon-button" type="button" title="立即刷新" aria-label="立即刷新">
            ↻
          </button>
          <a class="text-button heatmap-entry" href="./active-bond-index.html">活跃转债指数</a>
          <a class="text-button heatmap-entry" href="./bond-heatmap.html">转债星图</a>
          <a class="text-button heatmap-entry" href="./bond-tags.html">标签管理</a>
          <a class="text-button heatmap-entry trading-entry" href="./trading.html">实盘</a>
          <button id="editListButton" class="text-button" type="button">编辑</button>
          <button id="addSectorButton" class="text-button add-sector-button" type="button" title="新建板块">
            +板块
          </button>
          <button id="addStackButton" class="text-button add-stack-button" type="button" title="新建叠组">
            +叠组
          </button>
          <button id="bulkEditButton" class="text-button" type="button" title="批量编辑监控列表">列表</button>
        </div>
      </header>

      <section class="market-monitor-row" aria-label="主力信号与外围分时">
      <details id="tvMarketPanel" class="tv-market-panel" open>
        <summary>
          <strong id="marketPanelTitle">外围分时</strong>
          <span id="marketPanelSubtitle">TradingView / Yahoo · 延迟行情</span>
          <button id="bondPreviewReset" class="market-panel-reset" type="button" hidden>返回外围</button>
        </summary>
        <div id="externalMarketGrid" class="tv-market-grid">
          <article class="tv-market-card">
            <header>
              <strong>纳指100（NQ代理）</strong>
              <span>Capital.com CFD</span>
            </header>
            <tv-mini-chart
              symbol="CAPITALCOM:NAS100"
              theme="light"
              aria-label="纳斯达克100日内走势代理图"
            ></tv-mini-chart>
          </article>
          <article class="tv-market-card">
            <header>
              <strong>韩国KOSPI</strong>
              <span>新浪报价 · Yahoo分时</span>
            </header>
            <div id="kospiMarketChart" class="native-market-chart" aria-label="韩国KOSPI当日分时">
              <span class="native-market-loading">正在读取今日KOSPI…</span>
            </div>
          </article>
        </div>
        <div id="bondMarketPreview" class="bond-market-preview" hidden>
          <div id="bondPreviewLoading" class="bond-preview-loading" role="status">
            <span class="bond-preview-loading-mark" aria-hidden="true"></span>
            <strong id="bondPreviewLoadingTitle">正在打开转债分时</strong>
            <small>正在读取 MiniQMT，价格与图表马上显示</small>
          </div>
          <iframe
            id="bondMarketPreviewFrame"
            title="转债分时与指标预览"
          ></iframe>
        </div>
      </details>

      <div
        id="marketMonitorResizer"
        class="market-monitor-resizer"
        role="separator"
        aria-label="调整主力监控与分时区域宽度"
        aria-controls="signalMonitor tvMarketPanel"
        aria-orientation="vertical"
        aria-valuemin="35"
        aria-valuemax="70"
        aria-valuenow="49"
        tabindex="0"
        title="拖动调整宽度，双击恢复默认"
      ></div>

      <section
        id="signalMonitor"
        class="signal-monitor"
        aria-label="MiniQMT主力监控精灵"
        title="QMT全市场可转债只读监控"
      >
        <header class="signal-monitor-head">
          <div class="signal-monitor-title">
            <span class="signal-live-dot" aria-hidden="true"></span>
            <strong id="signalMonitorTitle">MiniQMT 主力监控精灵</strong>
            <span id="signalMonitorStatus">正在连接</span>
          </div>
          <div class="signal-monitor-controls">
            <label>
              <span>模式</span>
              <select id="signalMode">
                <option value="intraday">盘中信号</option>
                <option value="auction">竞价联动</option>
              </select>
            </label>
            <label>
              <span>显示</span>
              <select id="signalScope">
                <option value="focus">重点信号</option>
                <option value="all">全部信号</option>
              </select>
            </label>
            <label>
              <span>成交额</span>
              <select id="signalAmountFilter">
                <option value="0">不限</option>
                <option value="100000000">＞1亿</option>
                <option value="200000000">＞2亿</option>
              </select>
            </label>
            <label>
              <span>振幅</span>
              <select id="signalAmplitudeFilter">
                <option value="0">不限</option>
                <option value="0.01">＞1%</option>
                <option value="0.02">＞2%</option>
              </select>
            </label>
            <details id="signalTypeFilter" class="signal-type-filter">
              <summary id="signalTypeSummary">类型：不限</summary>
              <div class="signal-type-menu">
                <div class="signal-type-actions">
                  <button id="signalTypeClear" type="button">不限</button>
                  <button id="signalTypeSelectAll" type="button">全选</button>
                </div>
                <div id="signalTypeOptions" class="signal-type-options"></div>
              </div>
            </details>
            <button id="signalPauseButton" type="button">暂停滚动</button>
          </div>
        </header>
        <div id="signalFeed" class="signal-feed" aria-live="polite">
          <div class="signal-empty">正在读取MiniQMT盘中信号…</div>
        </div>
      </section>

      <div
        id="marketMonitorHeightResizer"
        class="market-monitor-height-resizer"
        role="separator"
        aria-label="调整主力监控与分时区域高度"
        aria-controls="signalMonitor tvMarketPanel"
        aria-orientation="horizontal"
        aria-valuemin="120"
        aria-valuemax="520"
        aria-valuenow="176"
        tabindex="0"
        title="上下拖动调整高度，双击恢复默认"
      ></div>
      </section>

      <section id="boardGrid" class="board-grid" aria-live="polite"></section>

      <section id="themeBondBoard" class="theme-bond-board" aria-label="题材转债看板" hidden>
        <header class="theme-board-head">
          <div id="themeBoardSummary" class="theme-board-summary">正在读取转债标签…</div>
          <div id="themeTagFilters" class="theme-tag-filters" aria-label="题材筛选"></div>
        </header>
        <div id="themeBondGrid" class="theme-bond-grid" aria-live="polite"></div>
      </section>

      <dialog id="editorDialog" class="editor-dialog">
        <form id="editorForm" method="dialog">
          <header class="editor-head">
            <h2>编辑监控列表</h2>
            <button id="closeEditorButton" class="icon-button" type="button" aria-label="关闭">×</button>
          </header>
          <p class="editor-hint">每行：板块|名称|代码；不填代码会按名称查找。例：白酒|贵州茅台|600519、可转债|韦尔转债|113616</p>
          <textarea id="stockListEditor" spellcheck="false"></textarea>
          <p id="editorMessage" class="editor-message"></p>
          <footer class="editor-actions">
            <button id="resetListButton" class="text-button" type="button">恢复默认</button>
            <button class="text-button" value="cancel" type="button" id="cancelEditorButton">取消</button>
            <button class="text-button primary" value="default" type="submit">保存</button>
          </footer>
        </form>
      </dialog>

      <dialog id="addStockDialog" class="editor-dialog add-stock-dialog">
        <form id="addStockForm" method="dialog">
          <header class="editor-head">
            <h2 id="addStockTitle">添加标的</h2>
            <button id="closeAddStockButton" class="icon-button" type="button" aria-label="关闭">×</button>
          </header>
          <label class="add-stock-field">
            <span>搜索</span>
            <input id="addStockInput" type="search" placeholder="输入代码 / 名称 / 股票 / ETF / 港股 / 转债" autocomplete="off" />
          </label>
          <div id="addStockSuggestions" class="suggestion-list" aria-live="polite"></div>
          <p id="addStockMessage" class="editor-message"></p>
          <footer class="editor-actions">
            <button class="text-button" value="cancel" type="button" id="cancelAddStockButton">取消</button>
            <button class="text-button primary" value="default" type="submit">添加</button>
          </footer>
        </form>
      </dialog>
    </main>

    <section id="bondOverlay" class="bond-overlay" aria-label="可转债分时详情" hidden>
      <iframe
        id="bondOverlayFrame"
        class="bond-overlay-frame"
        title="MiniQMT可转债分时指标"
      ></iframe>
    </section>

    <template id="cardTemplate">
      <article class="sector-card">
        <header class="sector-head">
          <span class="sector-name"></span>
          <span class="sector-change"></span>
        </header>
        <div class="stock-list"></div>
      </article>
    </template>

    <script src="./app.js" defer></script>
  </body>
</html>
